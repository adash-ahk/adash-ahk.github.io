<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>adash.ahk - A modern utility library for AutoHotkey</title>
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
	<meta name="description" content="A modern immutable utility library for AutoHotkey">
	<meta name="viewport"
		content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
	<link
		rel="stylesheet"
		href="/styles/style.css"
		title="docsify-darklight-theme"
		type="text/css"
	/>
	<link rel="icon" href="/favicon.ico" type="image/x-icon"/>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

	<!-- docsify-themeable -->
	<script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0"></script>
	<!-- ads -->
	<script data-cfasync="false" src="//dcbbwymp1bhlf.cloudfront.net/?wbbcd=1123408"></script>
</head>

<body>
	<!-- Top bar HTML -->
	<div id="app"></div>
	<script>
		// let /#concat work: rewrite to the docsify route /#/concat before docsify starts
		if (/^#[A-Za-z_$][\w$]*$/.test(location.hash)) {
			var _id = location.hash.slice(1);
			if (_id !== 'en' && _id !== 'ja') location.replace('#/' + _id);
		}
	</script>
	<script>
		window.$docsify = {
			homepage: 'en/docs.md',
			// clickable site name above the sidebar: always a way back to the docs
			name: 'adash.ahk',
			nameLink: { '/': '/', '/ja/': '/ja/docs' },
			// "#/" and "#/en" -> English docs; "#concat" (-> "#/concat") -> English docs scrolled to .concat
			loadNavbar: true,
			alias: {
				// one navbar per language (found from any page in that language's folder)
				'/en/(.*/)?_navbar.md': '/en/_navbar.md',
				'/ja/(.*/)?_navbar.md': '/ja/_navbar.md',
				'/en/?': '/en/docs.md',
				'/ja/?': '/ja/docs.md',
				'/(?!en/|ja/)([A-Za-z_$][\\w$]*)': '/en/docs.md'
			},
			maxLevel: 3,
			subMaxLevel: 3,

			executeScript: true,


			'flexible-alerts': {
				style: "flat"
			},

			darklightTheme: {
				defaultTheme : 'light',
				codeFontFamily : 'Consolas,Source Code Pro,Courier New',
				bodyFontSize : '17px',
				dark: {
					accent: '#3492ff',
					trim: '#214671',
					toggleBackground : '#ffffff',
					background: '#0f1216',
					backgroundAccent: '#0e1013',
					textColor: '#aaaaaa',
					codeTextColor : '#f3f3f3',
					codeBackgroundColor : '#181b1f',
					borderColor : '#0d2538',
					blockQuoteColor : '#D62828',
					highlightColor : '#FDAD0D',
					sidebarSublink : '#aaaaaa',
					codeTypeColor : '#ffffff',
					coverBackground : 'linear-gradient(to left bottom, hsl(118, 100%, 85%) 0%,hsl(181, 100%, 85%) 100%)',
					toggleImage : 'url(https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/icons/sun.svg)'
				},
				light: {
					accent: '#86b9f5',
					trim: '#eee',
					toggleBackground : '#091a28',
					background: '#ffffff',
					backgroundAccent: '#ffffff',
					textColor: '#34495e',
					codeTextColor : '#f3f3f3',
					codeBackgroundColor : '#282c34',
					borderColor : '#eee',
					blockQuoteColor : '#858585',
					highlightColor : '#86b9f5',
					sidebarSublink : '#34495e',
					codeTypeColor : '#091a28',
					coverBackground : 'linear-gradient(to left bottom, hsl(118, 100%, 85%) 0%,hsl(181, 100%, 85%) 100%)',
					toggleImage : 'url(https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/icons/moon.svg)'
				},
			},

			plugins: [
				// sidebar: lodash-style method filter + [-]/[+] category toggles.
				// docsify renders <ul><li>Category</li><ul>methods</ul><li>Category</li><ul>...</ul></ul>
				// (methods list is a *sibling* of its category <li>), so group them by hand.
				function sidebarToggle(hook) {
					var open = {};      // category title -> true/false once the user has chosen
					var query = '';

					function groups() {
						var root = document.querySelector('.sidebar-nav > ul');
						var out = [];
						if (!root) return out;
						Array.prototype.forEach.call(root.children, function (el) {
							if (el.tagName !== 'LI') return;
							var n = el.nextElementSibling;
							var ul = el.querySelector(':scope > ul') || (n && n.tagName === 'UL' ? n : null);
							out.push({ li: el, ul: ul, key: (el.textContent || '').trim() });
						});
						return out;
					}
					function isOpen(g) {
						if (query) return true;
						if (g.key in open) return open[g.key];
						return true;   // expanded by default; change to collapse by default
					}
					function render() {
						groups().forEach(function (g) {
							g.li.classList.toggle('collapse', !isOpen(g));
							if (g.ul) g.ul.classList.toggle('adash-collapsed', !isOpen(g));
						});
					}
					function filter() {
						groups().forEach(function (g) {
							var any = false;
							// a category-name match (e.g. "seq") shows the whole category
							var catMatch = !!query && g.key.toLowerCase().indexOf(query) > -1;
							if (catMatch) any = true;
							if (g.ul) g.ul.querySelectorAll('li').forEach(function (li) {
								var a = li.querySelector(':scope > a');
								var name = (a ? a.textContent : '').toLowerCase().replace(/^\./, '');
								var m = !query || catMatch || name.indexOf(query) > -1;
								li.classList.toggle('adash-hidden', !m);
								if (m) any = true;
							});
							var hide = !!query && !any;
							g.li.classList.toggle('adash-hidden', hide);
							if (g.ul) g.ul.classList.toggle('adash-hidden', hide);
						});
						render();
					}
					hook.doneEach(function () {
						var nav = document.querySelector('.sidebar-nav');
						if (!nav) return;

						if (!document.getElementById('adash-search')) {
							var sb = document.createElement('div');
							sb.id = 'adash-search';
							sb.className = 'adash-search';
							sb.innerHTML = '<i class="fa fa-search" aria-hidden="true"></i>' +
								'<input type="search" placeholder="Search" aria-label="Search methods" autocomplete="off">';
							var inp = sb.querySelector('input');
							inp.addEventListener('input', function () {
								query = inp.value.toLowerCase().trim().replace(/^_?\./, '');
								filter();
							});
							inp.addEventListener('keydown', function (e) {
								if (e.key === 'Enter') {
									var first = document.querySelector('.sidebar-nav ul ul li:not(.adash-hidden) > a');
									if (first) first.click();
								}
							});
							nav.parentNode.insertBefore(sb, nav);
						}

						groups().forEach(function (g) {
							if (!g.ul) return;
							g.li.classList.add('adash-cat');
							if (g.li.querySelector(':scope > .adash-toggle')) return;
							var b = document.createElement('span');
							b.className = 'adash-toggle';
							b.setAttribute('role', 'button');
							b.title = 'Expand / collapse';
							b.addEventListener('click', function (e) {
								e.preventDefault();
								e.stopPropagation();
								open[g.key] = !isOpen(g);
								render();
							});
							g.li.insertBefore(b, g.li.firstChild);
						});
						var si = document.querySelector('#adash-search input');
						if (si) si.placeholder = /^#\/ja(\/|$)/.test(location.hash) ? '検索' : 'Search';
						setTimeout(filter, 0);   // after docsify marks the active item
					});
				},
				// /concat -> scroll to the .concat method heading
				function methodShortcut(hook) {
					hook.doneEach(function () {
						var m = location.hash.match(/^#\/([A-Za-z_$][\w$]*)\/?$/);
						if (!m) return;
						setTimeout(function () {
							var el = document.getElementById(m[1].toLowerCase());
							if (el) el.scrollIntoView();
						}, 0);
					});
				},
				// Restores initial <title>
				function persistTitle(hook, vm) {
					var titleElm = document.querySelector('title');
					var rootTitle = titleElm && titleElm.textContent;
					var pageTitlePrefix = window.$docsify.name ? window.$docsify.name + ' - ' : '';

					if (rootTitle) {
						hook.doneEach(function () {
							var currentTitle = titleElm.textContent;
							var isRoot = !/^#\/[a-z]/i.test(location.hash);
							var newTitle = isRoot ? rootTitle : pageTitlePrefix + currentTitle;

							titleElm.textContent = newTitle;
						});
					}
				}
			]
		}
	</script>
	<script src="//unpkg.com/docsify/lib/docsify.min.js"></script>
	<script src="//unpkg.com/docsify-copy-code"></script>
	<script src="/js/prism-autohotkey.min.js"></script>
	<script src="https://unpkg.com/docsify-plugin-flexible-alerts"></script>
	<script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>
</body>
<footer>
	<script>
		// custom js would be here
	</script>
</footer>

</html>
